<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="leaf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#202421" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70C936"/>
      <stop offset="60%" stop-color="#469919"/>
      <stop offset="100%" stop-color="#266607"/>
    </linearGradient>
  </defs>
  <g filter="url(#leaf-shadow)">
    <!-- Main Leaf -->
    <path d="M40,118 C28,88 44,42 98,34 C124,30 134,42 128,68 C116,116 70,126 40,118 Z" fill="url(#leaf-grad)"/>
    <!-- Vein -->
    <path d="M44,114 Q78,82 108,46" stroke="#8FE055" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M68,92 Q60,78 52,80" stroke="#8FE055" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M84,78 Q82,64 74,68" stroke="#8FE055" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M78,82 Q92,86 100,82" stroke="#8FE055" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Second small leaf -->
    <path d="M50,118 C38,102 46,74 76,70 C92,68 98,74 94,88 C86,116 64,122 50,118 Z" fill="url(#leaf-grad)" opacity="0.9" transform="rotate(-35 60 100)"/>
  </g>
</svg>
