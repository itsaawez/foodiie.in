<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="berry-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#202421" flood-opacity="0.14"/>
    </filter>
    <radialGradient id="berry-red" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF4D64"/>
      <stop offset="60%" stop-color="#E61937"/>
      <stop offset="100%" stop-color="#A3071E"/>
    </radialGradient>
    <linearGradient id="berry-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A630"/>
      <stop offset="100%" stop-color="#2B6B12"/>
    </linearGradient>
  </defs>
  <g filter="url(#berry-shadow)">
    <!-- Strawberry Heart Body -->
    <path d="M80,146 C60,132 30,102 26,68 C22,42 46,32 80,44 C114,32 138,42 134,68 C130,102 100,132 80,146 Z" fill="url(#berry-red)"/>
    <!-- Yellow Seeds -->
    <g fill="#FFECA1" opacity="0.9">
      <ellipse cx="60" cy="62" rx="2" ry="3" transform="rotate(-10 60 62)"/>
      <ellipse cx="80" cy="64" rx="2" ry="3"/>
      <ellipse cx="100" cy="62" rx="2" ry="3" transform="rotate(10 100 62)"/>
      <ellipse cx="48" cy="82" rx="2" ry="3" transform="rotate(-15 48 82)"/>
      <ellipse cx="70" cy="86" rx="2" ry="3" transform="rotate(-5 70 86)"/>
      <ellipse cx="90" cy="86" rx="2" ry="3" transform="rotate(5 90 86)"/>
      <ellipse cx="112" cy="82" rx="2" ry="3" transform="rotate(15 112 82)"/>
      <ellipse cx="62" cy="108" rx="1.8" ry="2.8" transform="rotate(-10 62 108)"/>
      <ellipse cx="80" cy="112" rx="1.8" ry="2.8"/>
      <ellipse cx="98" cy="108" rx="1.8" ry="2.8" transform="rotate(10 98 108)"/>
      <ellipse cx="74" cy="130" rx="1.5" ry="2.2"/>
      <ellipse cx="86" cy="130" rx="1.5" ry="2.2"/>
    </g>
    <!-- Green Cap Leaves -->
    <g fill="url(#berry-leaf)">
      <path d="M80,42 Q66,22 54,28 Q68,38 76,43 Z"/>
      <path d="M80,42 Q94,22 106,28 Q92,38 84,43 Z"/>
      <path d="M80,42 Q80,16 80,12 Q76,26 80,42 Z"/>
      <path d="M80,42 Q48,34 38,44 Q56,46 74,44 Z"/>
      <path d="M80,42 Q112,34 122,44 Q104,46 86,44 Z"/>
    </g>
  </g>
</svg>
