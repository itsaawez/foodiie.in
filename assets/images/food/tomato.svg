<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="tom-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#202421" flood-opacity="0.14"/>
    </filter>
    <radialGradient id="tom-body" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF5C4D"/>
      <stop offset="60%" stop-color="#E52B1B"/>
      <stop offset="100%" stop-color="#B2160A"/>
    </radialGradient>
    <linearGradient id="tom-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E932A"/>
      <stop offset="100%" stop-color="#2D5C14"/>
    </linearGradient>
  </defs>
  <g filter="url(#tom-shadow)">
    <!-- Tomato Body -->
    <path d="M80,32 C115,28 142,50 144,88 C146,126 122,148 80,148 C38,148 14,126 16,88 C18,50 45,28 80,32 Z" fill="url(#tom-body)"/>
    <!-- Highlight Gloss -->
    <path d="M52,48 C72,40 92,44 100,50 C88,52 70,54 52,48 Z" fill="#FFA399" opacity="0.6"/>
    <!-- Stem / Calyx -->
    <g fill="url(#tom-leaf)">
      <path d="M80,35 Q65,22 55,26 Q68,34 74,38 Z"/>
      <path d="M80,35 Q95,22 105,26 Q92,34 86,38 Z"/>
      <path d="M80,35 Q85,12 80,6 Q75,12 80,35 Z"/>
      <path d="M80,35 Q58,38 50,45 Q64,44 75,39 Z"/>
      <path d="M80,35 Q102,38 110,45 Q96,44 85,39 Z"/>
    </g>
  </g>
</svg>
