<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="lemon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#202421" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="lemon-rind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFD000"/>
    </linearGradient>
    <linearGradient id="lemon-pulp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6"/>
      <stop offset="100%" stop-color="#FFE84D"/>
    </linearGradient>
  </defs>
  <g filter="url(#lemon-shadow)">
    <!-- Outer Rind -->
    <circle cx="80" cy="80" r="66" fill="url(#lemon-rind)" stroke="#F5B700" stroke-width="2"/>
    <!-- Pith Ring -->
    <circle cx="80" cy="80" r="58" fill="#FFFBE6"/>
    <!-- Segments Background -->
    <circle cx="80" cy="80" r="54" fill="#FFE84D"/>
    <!-- Center Core -->
    <circle cx="80" cy="80" r="9" fill="#FFFBE6"/>
    <!-- 8 Segments -->
    <g fill="url(#lemon-pulp)" stroke="#FFFBE6" stroke-width="3.5" stroke-linejoin="round">
      <path d="M80,71 A50,50 0 0,0 44,44 L72,74 Z"/>
      <path d="M71,80 A50,50 0 0,0 44,116 L74,88 Z"/>
      <path d="M80,89 A50,50 0 0,0 116,116 L88,86 Z"/>
      <path d="M89,80 A50,50 0 0,0 116,44 L86,74 Z"/>
      <path d="M74,72 A50,50 0 0,0 32,80 L71,80 Z"/>
      <path d="M86,72 A50,50 0 0,0 80,32 L80,71 Z"/>
      <path d="M86,88 A50,50 0 0,0 128,80 L89,80 Z"/>
      <path d="M74,88 A50,50 0 0,0 80,128 L80,89 Z"/>
    </g>
    <!-- Little seeds / highlights -->
    <circle cx="68" cy="62" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="94" cy="98" r="2" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
