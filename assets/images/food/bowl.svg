<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160">
  <defs>
    <filter id="bowl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#202421" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="ceramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DDD5"/>
    </linearGradient>
    <linearGradient id="soup-broth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBD38"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <g filter="url(#bowl-shadow)">
    <!-- Bowl Body -->
    <path d="M18,65 C18,122 55,142 90,142 C125,142 162,122 162,65 Z" fill="url(#ceramic)"/>
    <!-- Bowl Rim Rim Inner -->
    <ellipse cx="90" cy="65" rx="72" ry="24" fill="#F1ECE2"/>
    <!-- Golden Soup / Salad Base -->
    <ellipse cx="90" cy="67" rx="66" ry="20" fill="url(#soup-broth)"/>
    <!-- Fresh Garnishes inside bowl -->
    <!-- Boiled Egg half -->
    <ellipse cx="72" cy="67" rx="16" ry="11" fill="#FFFFFF"/>
    <ellipse cx="73" cy="67" rx="9" ry="7" fill="#F59E0B"/>
    <!-- Green Veggie Toppings -->
    <circle cx="114" cy="64" r="5" fill="#4E991F"/>
    <circle cx="122" cy="70" r="4.5" fill="#4E991F"/>
    <circle cx="106" cy="71" r="4" fill="#3D7D15"/>
    <!-- Sesame/Chili flakes -->
    <circle cx="94" cy="62" r="1.5" fill="#E52B1B"/>
    <circle cx="98" cy="68" r="1.5" fill="#E52B1B"/>
    <circle cx="88" cy="72" r="1.5" fill="#202421"/>
    <!-- Steam waves -->
    <path d="M78,34 Q82,24 78,16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M96,36 Q100,26 96,18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
